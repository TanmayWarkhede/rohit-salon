<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Services and Prices | The Rohit Salon, Chalisgaon</title><meta name="description" content="Hair, beard, skin care and wellness services with prices at The Rohit Salon, Chalisgaon. Book online.">
<link rel="icon" href="assets/images/branding/logo.png"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Montserrat:wght@600;700;800&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><header class="top"><a href="index.html" class="brand"><img src="assets/images/branding/logo.png" alt="The Rohit Salon logo" width="98" height="55"></a><a class="btn sm" href="index.html?book=">Book appointment</a></header>
<main class="wrap"><h1>Services &amp; prices</h1><p class="note">Online booking prices are shown. Tap Book to choose a time.</p>
<div class="bar"><input id="q" type="search" placeholder="Search services" aria-label="Search services"><select id="cat" aria-label="Category"><option value="">All categories</option></select></div>
<div id="list"><p class="empty">Loading…</p></div></main>
<footer><a href="index.html">Home</a> · <a href="about.html">About</a> · <a href="lookup.html">Check my booking</a></footer>
<script type="module">
import { api } from "./js/api.js"; import { $, esc, inr } from "./js/utils.js";
let all = [];
function render() {
  const q = $("#q").value.trim().toLowerCase(), c = $("#cat").value;
  const list = all.filter(s => (!c || s.category === c) && (!q || (s.name + " " + (s.description || "")).toLowerCase().includes(q)));
  if (!list.length) { $("#list").innerHTML = `<p class="empty">No services match your search.</p>`; return; }
  $("#list").innerHTML = [...new Set(list.map(s => s.category))].map(cat => `<div class="cat"><h3>${esc(cat)}</h3>${list.filter(s => s.category === cat).map(s => `
    <div class="svc"><div><strong>${esc(s.name)}</strong><small>${esc(s.description || "")} · ${s.duration} min</small></div>
    <span class="price">${inr(s.onlinePrice ?? s.price)}${s.startingPrice ? " onwards" : ""}</span><a class="btn sm" href="index.html?book=${encodeURIComponent(s.id)}">Book</a></div>`).join("")}</div>`).join("");
}
try {
  all = await api("/services");
  $("#cat").insertAdjacentHTML("beforeend", [...new Set(all.map(s => s.category))].map(c => `<option>${esc(c)}</option>`).join(""));
  render();
} catch (e) { console.error(e); $("#list").innerHTML = `<p class="empty">Services could not be loaded. Please refresh or call us.</p>`; }
let t; $("#q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(render, 200); }); $("#cat").addEventListener("change", render);
</script><script type="module" src="js/fx.js"></script></body></html>
